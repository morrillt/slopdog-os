# Skills owned by this repo, installed into each target's skills dir.
# Tab-separated: <skill>  <group folder inside the target's skills dir>
#
# The Claude target is the slopdog plugin (~/.claude/skills/slopdog), whose
# manifest lists the group folders -- a new group here must also be added to
# ~/.claude/skills/slopdog/.claude-plugin/plugin.json "skills", or it won't load.
#
# Only these are managed. Anything else living in a target's skills dir is left
# strictly alone -- slopdog/ also holds standalone skills (broz-report,
# cmux-panel, gdocs, file-report, pizza-*) that have nothing to do with Broz OS
# and must not be touched by this script.
#
# If a skill exists both here and in a target and is NOT listed below, it is an
# unmanaged copy free to drift. That is the exact failure this installer exists
# to prevent, so add it here rather than leaving it out.

conversation-log	git
github-search	research
reddit-search	research
web-search	research
youtube-publish	media
youtube-search	research
