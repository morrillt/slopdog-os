# Where Broz OS installs itself. Tab-separated, one target per line:
#
#   <id>  <display name>  <style>  <commands dir>  <skills dir>
#
# style   how the command shims are rendered for that tool:
#           claude  -- YAML frontmatter + body, nested dir gives the broz: prefix
#           cursor  -- plain markdown, no frontmatter, flat dir with a broz- prefix
# dirs    use - to skip that artifact type for this tool.
#
# Adding a tool is a one-line edit plus ./install.sh -- never a hand copy.
# Targets whose parent directory does not exist are skipped, so listing a tool
# you have not installed yet is harmless: install it later and re-run.
#
# Claude's skills dir is the slopdog skills-dir plugin (~/.claude/skills/slopdog),
# so everything installs as /slopdog:<name> alongside Todd's other skills, in
# the group folder named in skills.conf. The plain ~/.claude/skills root holds
# third-party plugins only -- installing there again would double every skill.
#
# Cursor's skills dir is deliberately '-'. Cursor loads skills from ~/.claude/
# skills for compatibility (cursor.com/docs/skills), so copying them again into
# ~/.cursor/skills would only produce duplicate entries in its picker.

claude-code	Claude Code	claude	~/.claude/commands/broz	~/.claude/skills/slopdog
cursor	Cursor	cursor	~/.cursor/commands	-
